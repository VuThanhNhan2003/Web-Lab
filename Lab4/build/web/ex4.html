<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Textarea Character Counter</title>
        <link rel="stylesheet" href="ex4.css">

    </head>
    <body>
        <div class="container">
            <div class="instruction">
                Write your message
            </div>
            <textarea id="message" rows="6" maxlength="250" placeholder="Start typing ..."></textarea>
            <div id="charCount">0 / 250</div>

        </div>

        <script>
            const textarea = document.getElementById('message');
            const charCountDisplay = document.getElementById('charCount');
            const maxChars = 250;

            textarea.addEventListener('input', () => {
                const currentLength = textarea.value.length;

                charCountDisplay.textContent = `${currentLength} / ${maxChars}`;

                if (currentLength >= maxChars) {
                    textarea.classList.add('red-border');
                    charCountDisplay.classList.add('red-text');
                } else {
                    textarea.classList.remove('red-border');
                    charCountDisplay.classList.remove('red-text');
                }
            });
        </script>
    </body>
</html>
