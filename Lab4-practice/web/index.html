<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Inside Background Image</title>

    <!-- Thêm Bootstrap 5 từ CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Cấu hình vùng chứa form và background image */
        .container2 {
            position: relative;
            width: 100%;
            max-width: 1480px;
            max-height: 820px;
            transform: translate(-9px, 0px);
            margin: 0 auto; /* Căn giữa phần tử trên trang */
            height: 100vh; /* Chiều cao chiếm 80% chiều cao của viewport */
            background-image: url('image/business.png');
            background-size: cover; /* Đảm bảo hình ảnh phủ toàn bộ khu vực chứa */
            background-position: center center; /* Căn giữa bức hình */
            background-repeat: no-repeat; /* Không lặp lại hình ảnh */
            display: flex;
            justify-content: center; /* Căn giữa form theo chiều ngang */
            align-items: center; /* Căn giữa form theo chiều dọc */
        }

        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-container {
            position: absolute;
            width: 100%;
            max-width: 670px; /* Kích thước tối đa của form */
            padding: 32px 20px;
            background-color: rgba(255, 255, 255, 0.7); /* Màu nền mờ */
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 32px;
        }

        .form-container h1 {
            color: #181A18;
            text-align: center;
            font-size: 52px;
            font-weight: 700;
            line-height: 60px;
            margin-bottom: 16px;
        }

        .form-container p {
            color: #181A18;
            text-align: center;
            font-size: 18px;
            font-weight: 400;
            line-height: 24px;
        }

        .form-container p2 {
            color: #181A18;
            font-family: Lato;
            font-size: 24px;
            font-weight: 700;
            line-height: 32px;
            margin-bottom: 32px;
        }

        .form-container input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 16px;
            background: var(--White, #FFF);
        }

        .form-container .property-details {
            display: flex;
            gap: 10px;
        }

        .form-container .property-details select {
            flex: 1;
        }

        .form-container button {
            width: 50%;
            padding: 22px 40px;
            background-color: #004f47;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            margin-left: 25%;
        }

        .form-container button:hover {
            background-color: #003f39;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            transform: scale(1.05);
        }

        .form-container button:active {
            transform: scale(0.95);
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .form-container {
                width: 80%;
                padding: 20px;
            }

            .form-container h1 {
                font-size: 36px;
            }

            .form-container button {
                width: 60%;
                margin-left: 20%;
            }
        }

        @media (max-width: 576px) {
            .form-container {
                width: 90%;
                padding: 15px;
            }

            .form-container h1 {
                font-size: 28px;
            }

            .form-container button {
                width: 80%;
                margin-left: 10%;
            }
        }
    </style>
</head>
<body>

    <div class="container2">
        <!-- Form Container -->
        <div class="form-container">
            <form class="needs-validation" novalidate>
                <!-- Title -->
                <div>
                    <h1>Earn more from your property, do less</h1>
                    <p>Find out if your property meets our criteria</p>
                </div>

                <!-- Input details -->
                <div class="section-2">
                    <div class="mb-3">
                        <input type="text" class="form-control" id="name" placeholder="Name *" required>
                        <div class="invalid-feedback">Please enter your name.</div>
                    </div>

                    <div class="mb-3">
                        <input type="email" class="form-control" id="email" placeholder="Email *" required>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>

                    <div class="mb-3">
                        <input type="tel" class="form-control" id="phone" placeholder="Phone number *" required>
                        <div class="invalid-feedback">Please enter your phone number.</div>
                    </div>

                    <div>
                        <p2>Property details</p2>
                        <div class="property-details">
                            <div class="mb-3">
                                <select class="form-select" id="city" required>
                                    <option value="" disabled selected>City *</option>
                                    <option value="city1">Ho Chi Minh city</option>
                                    <option value="city2">Ha Noi</option>
                                </select>
                                <div class="invalid-feedback">Please select a city.</div>
                            </div>

                            <div class="mb-3">
                                <select class="form-select" id="area" required>
                                    <option value="" disabled selected>Area *</option>
                                    <option value="area1">Thu Duc</option>
                                    <option value="area2">Tan Binh</option>
                                </select>
                                <div class="invalid-feedback">Please select an area.</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <select class="form-select" id="bedrooms" required>
                                <option value="" disabled selected># of bedrooms *</option>
                                <option value="1">1 Bedroom</option>
                                <option value="2">2 Bedrooms</option>
                                <option value="3">3 Bedrooms</option>
                            </select>
                            <div class="invalid-feedback">Please select the number of bedrooms.</div>
                        </div>
                    </div>
                </div>

                <!-- Submit button -->
                <div class="section-3">
                    <button type="submit">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Thêm Bootstrap và JavaScript để xử lý validation -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // JavaScript để xử lý form validation
        (function () {
            'use strict'

            // Lấy tất cả các form có class "needs-validation"
            var forms = document.querySelectorAll('.needs-validation')

            // Duyệt qua tất cả các form
            Array.prototype.slice.call(forms)
                .forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault() // Ngừng gửi form nếu không hợp lệ
                            event.stopPropagation()
                        }

                        form.classList.add('was-validated') // Thêm lớp "was-validated" sau khi submit
                    }, false)
                })
        })()
    </script>
</body>
</html>
